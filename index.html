<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit</title>
    <link rel="stylesheet" href="src/styles/title-screen.css">
    <link rel="stylesheet" href="src/styles/levels.css">
    <link href="https://fonts.googleapis.com/css2?family=Kode+Mono:wght@400..700&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
  </head>
  <body>
    <canvas id="starfield"></canvas>
    <div id="title-screen">
      <button class="button" id="fullscreen"><img src="assets/images/title/fullscreen.png" height="30px" width="30px"></button>
      <h1 id="title">Orbit</h1>
      <div id="buttons">
        <button class="button">Start new game</button>
        <button class="button" id="levels-button">Planets</button>
        <button class="button">About</button>
      </div>
    </div>
    <div id="levels">
      <button class="button" id="home"><img src="assets/images/levels/home.png" height="30px" width="30px"></button>
      <div id="planets">
        <button class="locked-planet" id="neptune">
          <img src="assets/images/levels/neptune-locked.gif">
        </button>

        <button class="locked-planet" id="uranus">
          <img src="assets/images/levels/uranus-locked.gif">
        </button>

        <button class="locked-planet" id="saturn">
          <img src="assets/images/levels/saturn-locked.gif">
        </button>

        <button class="locked-planet" id="jupiter">
          <img src="assets/images/levels/jupiter-locked.gif">
        </button>

        <button class="locked-planet" id="mars">
          <img src="assets/images/levels/mars-locked.gif">
        </button>

        <button class="locked-planet" id="earth">
          <img src="assets/images/levels/earth-locked.gif">
        </button>

        <button class="locked-planet" id="venus">
          <img src="assets/images/levels/venus-locked.gif">
        </button>

        <button class="locked-planet" id="mercury">
          <img src="assets/images/levels/mercury-locked.gif">
        </button>
      </div>
      <img id="sun" src="assets/images/levels/sun.gif">
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script type="module" src="src/modules/title-screen/title-screen.js"></script>
    <script type="module" src="src/modules/levels-screen/levels.js"></script>
    <script type="module" src="src/main.js"></script>
    <div id="tooltip"></div>
  </body>
</html>
