<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>orbit-x-code</title>
  <style>
            body {
        margin: 0;
        padding: 0;
        background-color: #929292;
        font-family: 'Courier New', Courier, monospace;
      }
      #escape-room {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        box-shadow: border-box;
        min-height: 100vh;
      }

    .view-title {
      color:#000000;
      font-size: 32px;
      margin: 10px 0;
      text-align: center;
      font-weight: bold;
    }
     
    .inventory-container {
      background-color: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      padding: 15px 30px;
      width: 90%;
      max-width: 1000px;
      box-shadow: 0px 8px 32px rgba(0,0,0, 0.2);


    }
   
         .inventory-bar {
          display: flex;
          justify-content: space-between;
          gap: 15px;
         }
         .inventory-slot {
          background-color: #e0e0e0;
          width: 100px;
          height:100px;
          border-radius: 15px;
          display: flex;
          align-items: flex-end;
          justify-content: center;
          padding-bottom: 5px;
          box-sizing: border-box;

         } 
         .slot-text {
          color: #000000;
          font-size: 14px;
          font-weight: bold;
         }
         .keys-container {
          background-color: rgba(255, 255, 255, 0.15);
          backdrop-filter: blur(10px);
          border: 1px solid rgba(255, 255, 255, 0.25);
          border-radius: 8px;
          padding: 8px 15px;
          display: flex;
          align-items: center;
          gap: 10px;
          margin-top: 15px;
          align-self: flex-start;
          margin-left: 5%;
          box-shadow: 0px 4px 16px rgba(0,0,0, 0.15);
         }

         .key-badge {
          background-color: #ffffff;
          padding: 3px 8px;
          font-size: 12px;
          font-weight: bold;
          border-radius: 4px;
          border: 1px solid #000;
         }
         .main-sence {
          display:flex;
          justify-content:dspace_between;
          align-items:center;
          width:100%;
          margin: 40px 0;
          padding: 0 5%;
          box-sizing: border-box;
         }
         .nav-arrow {
           background: none;
           border: none;
           font-size: 64px;
           font-weight:bold;
           color: #000000;
           cursor: pointer;
         }
         .plants-laboratory {
          display:flex;
          justify-content: center;
          align-items: center;
          gap: 20px;
          flex-grow:1;
         }
         .plant-card {
              border:2px solid #ffffff;
              border-radius: 12px;
              padding: 10px;
              display:flex;
              flex-direction: column;
              align-items: center;
                width: 130px;
                box-shadow: 0px 4px 12px rgba(0,0,0, 0.3);
         }
 
               .plants-laboratory .plant-card:nth-child(1) { background-color: #8a2be2; } 
              .plants-laboratory .plant-card:nth-child(2) { background-color:  #ff69b4; }
              .plants-laboratory .plant-card:nth-child(3) { background-color: #9370db; }
              .plants-laboratory .plant-card:nth-child(4) { background-color: #00ced1; }
              .plats -laboratory .plant-card:nth-child(5) { background-color: #ff1493; }  
         .pl
         .plant-image-box{
          background-color: #ffffff; 
          width: 100px;
          height: 100px;
          border-radius: 8px;
          display:flex;
          align-items: center;
          justify-content: center;
          overflow: hidden;
         }
         .planet-img {
          width: 90px;
          height: 90px;
          object-fit: contain;
         }
         .plant-name {
          color: #ffffff;
          font-size: 11px;
          font-weight: bold;
          margin-top: 10px; 
          text-align: center;
         }
  </style>
